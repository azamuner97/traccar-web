name: Build Project

on:
  push:
    branches: [ master, project ]
  pull_request:
    branches: [ master, project ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
    - uses: actions/setup-node@v6
      with:
        node-version: 22
        cache: npm
        cache-dependency-path: package-lock.json
    - run: npm ci
    - run: npm test
    - run: npm run build
